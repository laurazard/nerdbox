name: Spec verify

# Runs the formal-spec verification suite (`task spec:test|run|verify`)
# against the Quint specs under `spec/`, plus the regen drift gate. See
# spec/README.md for what each task does.

on:
  pull_request:
    branches: ['main', 'release/**']
    paths:
      - 'spec/**'
      - 'Taskfile.yml'
      - '.github/workflows/spec-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Quint is distributed on npm. `quint verify` fetches Apalache on demand.
  QUINT_VERSION: 0.32.0

jobs:
  spec-verify:
    name: Spec verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK (for Apalache)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Apalache distribution
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5
        with:
          path: ~/.quint
          key: apalache-quint-${{ env.QUINT_VERSION }}

      - name: Install Quint
        run: npm install -g "@informalsystems/quint@${QUINT_VERSION}"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: '.github/.tool-versions'

      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa  # v2.1.0
        with:
          version: 3.x

      - run: task spec:test
      - run: task spec:run
      - run: task spec:verify
